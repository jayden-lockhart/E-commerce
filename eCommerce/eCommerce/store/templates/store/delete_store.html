{% extends 'store/base.html' %}
{% block content %}
     <header class="bg-dark py-5">
            <div class="container px-4 px-lg-5 my-5">
                <div class="text-center text-white">
                    <h1 class="display-4 fw-bolder">Delete Store</h1>
                    <p class="lead fw-normal text-white-50 mb-0">Please confirm you want to delete {{ store.name }}.</p>
                </div>
            </div>
        </header>
        <div class="container">
            <div class="row">
                <center>
                <div class="col-lg-8 col-md-10 mx-auto">
                    <form method="POST" action="{% url 'delete_store' store.id %}" enctype="multipart/form-data">
                        {% csrf_token %}
                        <a href="{% url 'store' store.id %}" class="btn btn-secondary">Cancel</a>
                        
                        <br>
                        <button type="submit" class="btn btn-danger">Delete Store</button>
                        
                    </form>
                    <br>
                </div>
                </center>
            </div>
        </div>

{% endblock %}
