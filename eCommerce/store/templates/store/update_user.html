{% extends 'store/base.html' %}
{% block content %}
     <header class="bg-dark py-5">
            <div class="container px-4 px-lg-5 my-5">
                <div class="text-center text-white">
                    <h1 class="display-4 fw-bolder">Update User</h1>
                    <p class="lead fw-normal text-white-50 mb-0">Please enter your details to update your account.</p>
                </div>
            </div>
        </header>
        <div class="container">
            <div class="row">
                <center>
                <div class="col-lg-8 col-md-10 mx-auto">
                    <form method="POST" action="{% url 'update_user' %}">
                        {% csrf_token %}

                        {{ form.as_p }}
                        <br>
                        <button type="submit" class="btn btn-primary">Update User</button>
                        
                    </form>
                    {% if user.groups.all.0.name == 'buyer' %}
                    <br>
                                        <a href="{% url 'become_vendor' %}" class="btn btn-success">Become Vendor</a>
                    {% else %}
                    <br>
                                        <a href="{% url 'become_buyer' %}" class="btn btn-success">Become Buyer</a>
                    {% endif %}
                
                                
                    <br>
                    <a href="{% url 'update_password' %}" class="btn btn-success">Update password</a>
                </div>
                </center>
            </div>
        </div>

{% endblock %}
